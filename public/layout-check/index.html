<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Storefront layout verification</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#e9ecf1;font:14px system-ui;color:#101318}header{display:flex;gap:16px;align-items:center;margin-bottom:12px}h1{font-size:18px;margin:0}button{padding:8px 12px;border:1px solid #9ba4b2;border-radius:6px;background:white}main{display:flex;gap:14px;align-items:flex-start}article{flex:none}h2{margin:0 0 6px;font-size:14px}iframe{border:1px solid #bcc3cd;background:white;height:820px;display:block}output{display:block;max-width:430px;min-height:38px;font-size:12px;margin:6px 0;color:#234e30}
</style></head><body><header><h1>Storefront layout verification</h1><button data-section="trendingGrid">Trending</button><button data-section="inventory">Inventory</button></header><main>
<article><h2>320px</h2><iframe title="320px phone" width="320" src="/?qa=320"></iframe><output></output></article>
<article><h2>390px</h2><iframe title="390px phone" width="390" src="/?qa=390"></iframe><output></output></article>
<article><h2>430px</h2><iframe title="430px phone" width="430" src="/?qa=430"></iframe><output></output></article>
</main><script>
let section='trendingGrid';
function inspect(frame){const doc=frame.contentDocument;const root=doc.getElementById(section);if(!root||!root.querySelector('.catalog-card'))return false;const cards=[...root.querySelectorAll('.catalog-card')];const failures=[];for(const card of cards){const c=card.getBoundingClientRect();for(const control of card.querySelectorAll('.catalog-actions .btn')){const b=control.getBoundingClientRect();if(b.left<c.left||b.right>c.right+1||b.top<c.top||b.bottom>c.bottom+1||b.height<43)failures.push(control.textContent)}}const first=cards[0];const r=first.getBoundingClientRect();frame.contentWindow.scrollTo({top:frame.contentWindow.scrollY+r.top-100,behavior:'instant'});frame.nextElementSibling.textContent=`${cards.length} cards checked. First card: ${Math.round(r.height)}px. ${failures.length?'FAIL: '+failures.join(', '):'PASS: all actions contained, tap targets ≥44px.'}`;return true}
for(const frame of document.querySelectorAll('iframe')){frame.addEventListener('load',()=>{let attempts=0;const timer=setInterval(()=>{if(inspect(frame)||++attempts>100)clearInterval(timer)},150)})}
for(const button of document.querySelectorAll('button'))button.onclick=()=>{section=button.dataset.section;document.querySelectorAll('iframe').forEach(inspect)};
</script></body></html>
